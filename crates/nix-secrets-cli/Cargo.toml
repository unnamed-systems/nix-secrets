[package]
name                   = "nix-secrets-cli"
description            = "nix-secrets user-facing CLI"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
readme                 = "README.md"

[dependencies]
nix-secrets-core.workspace = true

tracing.workspace = true 
tracing-error.workspace = true 
tracing-subscriber.workspace = true
thiserror.workspace = true
eyre.workspace = true
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
age.workspace = true 

clap = { version = "4.6.4", features = ["derive", "env"] }
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }
color-eyre = "0.6.5"
shlex = { version = "2.0.1", default-features = false }
sha2 = "0.10.0"
dirs = "6.0.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
scopeguard = "1.2.0"
aho-corasick = "1.1.5"
