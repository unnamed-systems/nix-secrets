[workspace.package]
name = "nix-secrets"
version = "0.5.0"
rust-version = "1.94.0"
license = "EUPL-1.2"
edition = "2024"
repository = "https://github.com/unnamed-systems/nix-secrets"

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
nix-secrets-core = { path = "./crates/nix-secrets-core" }

serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"

age = { version = "0.12.1", default-features = false, features = ["cli-common", "ssh", "armor", "plugin"] }
eyre = { version = "0.6.12", features = ["track-caller"] }
nix = { version = "0.31.3", features = ["user", "hostname", "fs", "mount"] }
thiserror = "2.0.19"
tracing = { version = "0.1.44", features = ["max_level_trace"] }
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.dev]
opt-level = 0
debug = 0
panic = "unwind"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"

[workspace.lints.clippy]
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf       = { level = "warn", priority = -1 }
style      = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
